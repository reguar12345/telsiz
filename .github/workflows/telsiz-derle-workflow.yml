          echo "--- olusturulan dosyalar ---"
          find proj -type f | sort

      # ForgeGradle 2.3 SADECE Java 8 ile calisir
      - name: JDK 8 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # ForgeGradle 2.3, Gradle 5+ ile uyumsuz
      - name: Gradle 4.4.1 kur
        run: |
          curl -sSLo gradle.zip https://services.gradle.org/distributions/gradle-4.4.1-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-4.4.1/bin" >> "$GITHUB_PATH"

      - name: Surumler
        run: |
          java -version
          gradle --version

      - name: Derle
        working-directory: proj
        run: gradle build --no-daemon --stacktrace

      - name: Uretilen jar
        run: ls -lh proj/build/libs/

      - name: Jar'i yukle
        uses: actions/upload-artifact@v4
        with:
          name: telsiz-jar
          path: proj/build/libs/*.jar
          if-no-files-found: error
