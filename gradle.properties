## .jar üretme

Üç yol var. En kolayından zoruna:

### 1. GitHub Actions (JDK 8 kurmadan)

Projeyi bir GitHub deposuna atın. `.github/workflows/build.yml` hazır geliyor:

```bash
cd telsiz
git init && git add . && git commit -m "Telsiz"
git remote add origin https://github.com/KULLANICI/telsiz.git
git push -u origin main
```

Push'tan sonra **Actions** sekmesi → biten çalışma → **Artifacts** → `telsiz-jar` indir.
İçinden `telsiz-1.0.0.jar` çıkar.

### 2. Yerelde Gradle 4.4.1 ile

ForgeGradle 2.3, **JDK 8** ve **Gradle 4.4.1** gerektirir. Daha yeni JDK veya Gradle 5+ çalışmaz.

```bash
java -version    # 1.8.0_xxx görmelisiniz
gradle -version  # 4.4.1 görmelisiniz

cd telsiz
gradle build
```

Çıktı: `build/libs/telsiz-1.0.0.jar`

### 3. Wrapper üreterek

```bash
gradle wrapper --gradle-version 4.4.1   # gradlew dosyalarını oluşturur
./gradlew build
```

`gradle/wrapper/gradle-wrapper.properties` zaten hazır, sadece `gradlew` betiği ve wrapper
jar'ı eksik.

### IDE için

```bash
gradle setupDecompWorkspace
gradle eclipse      # veya IntelliJ'de Gradle projesi olarak import edin
```

