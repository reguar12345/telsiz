## Geliştirme notları

- **`runClient` içinde test:** Yayınlanmış mod jar'ları SRG isimli olduğu için geliştirme
  ortamına doğrudan atılamaz. `build.gradle` içindeki `deobfProvided` satırını açabilirsiniz,
  ama en pratik yol jar'ı derleyip gerçek bir 1.12.2 kurulumunda denemek.
- **Telsiz sesinin yanındakiler tarafından da duyulması** (gerçek telsiz gibi "sızma" efekti)
  isterseniz, `RadioTransmissions` içindeki `StaticAudioChannel` yerine alıcının konumunda
  `api.createLocationalAudioChannel(...)` kullanıp her pakette `updateLocation` çağırmanız yeterli.
- **Parazit / bozulma efekti** için `MicrophonePacket` verisini `api.createDecoder()` ile PCM'e
  çevirip işledikten sonra `api.createEncoder()` ile tekrar kodlayabilirsiniz.

Simple Voice Chat API dökümantasyonu: <https://modrepo.de/minecraft/voicechat/api>
