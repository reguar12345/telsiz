## Proje yapısı

```
src/main/java/com/telsiz/
├── Telsiz.java                       Ana mod sınıfı
├── TelsizConfig.java                 Forge config
├── item/
│   ├── ItemWalkieTalkie.java         Telsiz eşyası (NBT: kanal + açık/kapalı)
│   └── ModItems.java                 Eşya kaydı
├── client/
│   └── ClientRegistryHandler.java    Model kaydı (sadece istemci)
├── radio/
│   ├── RadioState.java               Tek oyuncunun telsiz durumu
│   └── RadioRegistry.java            Sunucu thread'inde anlık görüntü üretir
└── voice/
    ├── TelsizVoicechatPlugin.java    Simple Voice Chat eklentisi
    └── RadioTransmissions.java       Aktif yayınların ses kanalları
```

