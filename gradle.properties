# Telsiz — Minecraft 1.12.2 Walkie-Talkie Modu

Simple Voice Chat üzerine kurulu bir telsiz modu. Aynı kanaldaki oyuncular, aralarındaki
mesafe ne olursa olsun birbirini duyar.

- **Minecraft:** 1.12.2
- **Mod loader:** Forge 14.23.5.2860
- **Zorunlu bağımlılık:** [Simple Voice Chat](https://www.curseforge.com/minecraft/mc-mods/simple-voice-chat) — Forge 1.12.2 sürümü (2.6.x önerilir)

---

## Nasıl çalışıyor

Simple Voice Chat'in eklenti (plugin) API'sini kullanıyor. Mod, sunucuda mikrofon paketlerini
yakalıyor: konuşan oyuncunun elinde açık bir telsiz varsa, sesi normal yakınlık sohbetine ek
olarak aynı kanaldaki tüm telsizlere **static audio channel** üzerinden gönderiyor. Static kanal,
Simple Voice Chat'in grup sohbetinde kullandığı ses türü — yani mesafeden bağımsız, sabit seviyede.

Simple Voice Chat eklentiyi `@ForgeVoicechatPlugin` anotasyonu sayesinde kendisi buluyor
(1.12.2'de Forge'un ASMDataTable taraması ile), ekstra kayıt kodu gerekmiyor.

### Thread güvenliği hakkında not

`MicrophonePacketEvent` sunucu thread'inde değil, Simple Voice Chat'in kendi ağ thread'inde
tetikleniyor. Oradan oyuncu envanterine dokunmak veri yarışına (data race) yol açar. Bu yüzden
mod, sunucu thread'inde her birkaç tick'te bir "kim hangi kanalda açık telsiz taşıyor" bilgisinin
değişmez (immutable) bir anlık görüntüsünü yayımlıyor; ses thread'i yalnızca o görüntüyü okuyor.

---

## Kullanım

| İşlem | Sonuç |
|---|---|
| Sağ tık | Telsizi aç / kapat |
| Shift + sağ tık | Sonraki kanala geç |

Telsiz açıkken eşyanın üzerinde büyü parıltısı görünür. Kanal ve durum bilgisi tooltip'te yazar.

**Konuşmak için ayrı bir tuş yok** — Simple Voice Chat'in kendi bas-konuş (push-to-talk) tuşunu
kullanıyorsunuz. Elinizde açık bir telsiz varken konuştuğunuzda ses otomatik olarak telsize gider.

Oyuncular Simple Voice Chat'in ses ayarları ekranından "Telsiz" kategorisinin sesini
ayrı ayarlayabilir.

### Tarif

```
 I       I = Demir külçe
IRI      R = Redstone
IRI
```

