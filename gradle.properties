## Kurulum

1. Forge 14.23.5.2860 (1.12.2) kurun
2. `voicechat-forge-1.12.2-2.6.x.jar` dosyasını `mods/` klasörüne atın
3. `telsiz-1.0.0.jar` dosyasını `mods/` klasörüne atın
4. Aynı ikisini sunucudaki `mods/` klasörüne de atın
5. Sunucuda **UDP 24454** portunu açın (Simple Voice Chat'in ses portu — bu olmadan ses hiç çalışmaz)

Simple Voice Chat hem istemcide hem sunucuda gerekli. Telsiz modu da öyle.

