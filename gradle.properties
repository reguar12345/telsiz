## Ayarlar (`config/telsiz.cfg`)

| Ayar | Varsayılan | Açıklama |
|---|---|---|
| `maxChannels` | 8 | Kaç kanal arasında geçiş yapılabilir |
| `requireInHand` | true | `false` yaparsanız envanterde duran açık telsiz de çalışır |
| `cancelProximity` | false | `true` yaparsanız telsize konuşurken yanınızdakiler sizi normal sesle duymaz |
| `crossDimension` | true | Boyutlar arası (Nether ↔ Overworld) iletişim |
| `maxDistance` | -1 | Menzil sınırı (blok). -1 = sınırsız. 0'dan büyükse aynı boyut şartı da gelir |
| `scanIntervalTicks` | 2 | Telsiz durumu kaç tick'te bir taranır |
| `bypassGroupIsolation` | true | İzole grup sohbetindeki oyuncular da telsizi duyar |
| `transmissionTimeoutMs` | 600 | Bu kadar sessizlikten sonra yayın kapatılır |
| `playClickSound` | true | Aç/kapa ve kanal değişiminde klik sesi |

