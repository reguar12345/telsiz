buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        maven { url = 'https://plugins.gradle.org/m2/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.0.0'
group = 'com.telsiz'
archivesBaseName = 'telsiz'

// ForgeGradle 2.3 requires Java 8. Newer JDKs will not work.
sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

minecraft {
    version = '1.12.2-14.23.5.2860'
    runDir = 'run'
    mappings = 'snapshot_20171003'
    makeObfSourceJar = false
}

repositories {
    // Simple Voice Chat API (plain Java, no Minecraft classes - no deobfuscation needed)
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    // Only needed if you uncomment the deobfProvided line below
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    // Compile only: Simple Voice Chat ships these classes itself at runtime.
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.20'

    // OPTIONAL - only if you want to run Simple Voice Chat inside `gradlew runClient`.
    // Released mod jars are SRG-named, so they must be deobfuscated for the dev environment.
    // Easier alternative: build the jar and test it in a real 1.12.2 Forge instance.
    // deobfProvided 'maven.modrinth:simple-voice-chat:forge-1.12.2-2.6.13'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : 'telsiz',
                'Specification-Version' : project.version,
                'Implementation-Title'  : 'Telsiz',
                'Implementation-Version': project.version
        ])
    }
}
